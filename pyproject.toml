[build-system]
requires = ["setuptools>=40.8.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "RosettaX"
version = "0.10.7"
description = "Interactive fluorescence and scattering calibration workflows for flow cytometry."
license = "AGPL-3.0-or-later"
readme = "README.rst"
requires-python = ">=3.11"
authors = [{ name="Martin Poinsinet de Sivry-Houle", email="martin.poinsinet.de.sivry@gmail.com"}]
classifiers = [
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Development Status :: 3 - Alpha",
    "Topic :: Scientific/Engineering :: Physics",
    "Intended Audience :: Science/Research"
]

keywords = [
    "flow-cytometry",
    "calibration",
    "scattering",
    "fluorescence",
    "data-analysis",
]

dependencies = [
    "PyMieSim ==6.0.4",
    "numpy >=2.2.6",
    "pandas >=2.2",
    "typing_extensions >=4.10",
    "flask >=3.0",
    "werkzeug >=3.0",
    "matplotlib >=3.8",
    "dash >=4.1.0",
    "dash-bootstrap-components >=2.0.4",
    "plotly >=6.7.0",
    "gunicorn >=23.0.0",
    "psycopg[binary] >=3.2.9",
]

[project.scripts]
rosettax = "RosettaX.__main__:main"

[project.urls]
Homepage = "https://github.com/MartinPdeS/RosettaX"
Documentation = "https://martinpdes.github.io/RosettaX/"
Repository = "https://github.com/MartinPdeS/RosettaX.git"

[tool.setuptools]
include-package-data = false

[tool.setuptools.package-data]
RosettaX = [
    "assets/*.css",
    "assets/*.js",
    "assets/*.json",
    "assets/*.png",
    "assets/*.svg",
    "assets/**/*.css",
    "assets/**/*.js",
    "assets/**/*.json",
    "assets/**/*.png",
    "assets/**/*.svg",
    "presets/**/*.json",
    "calibrations/**/*.json",
    "data/**/*",
]

[tool.setuptools.exclude-package-data]
RosettaX = ["assets/sample-files/*.fcs"]

[tool.setuptools.packages.find]
include = ["RosettaX", "RosettaX.*"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
ignore = ["UP038"]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401"]
"tests/**/*.py" = ["E402"]
"RosettaX/_version.py" = ["UP006", "UP007", "UP035"]

[project.optional-dependencies]
release = ["martinpdes-maintenance==0.2.2"]
testing = [
    "pytest >=7.4,<10.0",
    "pytest-cov >=2,<8",
    "pytest-json-report ~=1.5",
    "coverage ~=7.6"
]

documentation = [
    "MartinPdeS-docs>=0.2.5,<0.3",
]

dev = [
    "flake8 ==7.4.1",
    "ruff >=0.6,<1",
]

bundling = [
    "pyinstaller >=6.14,<7",
]

[tool.mps-maintenance]
version-file = "RosettaX/_version.py"
version-method = "literal"
conda-recipe = "conda.recipe/meta.yaml"
