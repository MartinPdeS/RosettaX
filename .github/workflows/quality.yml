name: Static quality checks
on:
  push:
    branches: ["master"]
    paths-ignore:
      # `make release` commits only the generated package version before tagging.
      - "RosettaX/_version.py"
  pull_request:
    branches: ["master"]
permissions:
  contents: read
jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.13"
      - run: python -m pip install "ruff>=0.6,<1"
      - run: python -m ruff check RosettaX tests
