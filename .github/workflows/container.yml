name: Container smoke test

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: true

jobs:
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build application image
        run: docker compose build --pull

      - name: Start application and wait for health check
        run: docker compose up --detach --wait --wait-timeout 180

      - name: Check application and record persistent state
        run: docker compose exec -T rosettax python - --require-non-root --record-state < tools/container_smoke.py

      - name: Recreate container and wait for health check
        run: docker compose up --detach --force-recreate --wait --wait-timeout 180

      - name: Verify application and persistent state
        run: docker compose exec -T rosettax python - --require-non-root --verify-state < tools/container_smoke.py

      - name: Show application logs
        if: always()
        run: docker compose logs --no-color

      - name: Stop test application
        if: always()
        run: docker compose down --volumes
