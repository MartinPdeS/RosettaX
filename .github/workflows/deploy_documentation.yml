name: Documentation
'on':
  push:
    branches:
    - master
    paths-ignore:
    - RosettaX/_version.py
  pull_request:
    branches:
    - master
permissions:
  contents: read
jobs:
  documentation:
    permissions:
      contents: read
    uses: MartinPdeS/MPSActions/.github/workflows/build_documentation.yml@v17
    with:
      python-version: '3.13'
      package-name: RosettaX
      apt-package: xvfb jq
      debug: true
