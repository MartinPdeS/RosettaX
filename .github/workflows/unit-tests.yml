name: Unit tests

on:
  push:
    branches: ["master"]
    paths-ignore:
      # `make release` commits only the generated package version before tagging.
      - "RosettaX/_version.py"
  pull_request:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unit-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  collect:
    name: Collect tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Set up Python and CI dependencies
        uses: MartinPdeS/MPSActions/actions/setup-python@0f5927acf88b25b5d253421e508387897096a2cc
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: "pyproject.toml"
          install-command: >-
            python -m pip install -e ".[testing]"
          fetch-depth: "0"
      - name: Collect test suite
        env:
          PYTHONHASHSEED: "0"
        run: python -m pytest --collect-only -q

  tests:
    name: Python ${{ matrix.python-version }} / ${{ matrix.os }}
    needs: collect
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"

    steps:
      - name: Set up Python and CI dependencies
        uses: MartinPdeS/MPSActions/actions/setup-python@0f5927acf88b25b5d253421e508387897096a2cc
        with:
          python-version: "${{ matrix.python-version }}"
          cache: "pip"
          cache-dependency-path: "pyproject.toml"
          install-command: >-
            python -m pip install -e ".[testing]"
          fetch-depth: "0"
      - name: Run unit tests
        env:
          PYTHONHASHSEED: "0"
        run: >-
          python -m pytest
          --cov=RosettaX
          --cov-report=xml:coverage.xml
          --cov-report=term-missing
          --cov-fail-under=55
          --json-report
          --json-report-file=test-results.json
          --maxfail=1

      - name: Upload coverage and test results
        if: always() && matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: |
            coverage.xml
            test-results.json
            htmlcov/
          if-no-files-found: error

  integration:
    name: Real dependencies / Python ${{ matrix.python-version }} / ${{ matrix.os }}
    needs: collect
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: macos-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.13"
    steps:
      - name: Set up Python and CI dependencies
        uses: MartinPdeS/MPSActions/actions/setup-python@0f5927acf88b25b5d253421e508387897096a2cc
        with:
          python-version: "${{ matrix.python-version }}"
          cache: "pip"
          cache-dependency-path: "pyproject.toml"
          install-command: >-
            python -m pip install -e ".[testing]"
          fetch-depth: "0"
      - name: Run isolated integration suite
        env:
          MPLBACKEND: Agg
          PYTHONHASHSEED: "0"
        run: python -m pytest integration_tests -o addopts='' -v --junitxml=integration-results.xml

      - name: Upload integration results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-${{ matrix.os }}-${{ matrix.python-version }}
          path: integration-results.xml
          if-no-files-found: warn

  package-smoke:
    name: Package smoke test / Python ${{ matrix.python-version }}
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - name: Set up Python and CI dependencies
        uses: MartinPdeS/MPSActions/actions/setup-python@0f5927acf88b25b5d253421e508387897096a2cc
        with:
          python-version: "${{ matrix.python-version }}"
          cache: "pip"
          cache-dependency-path: "pyproject.toml"
          install-command: >-
            python -m pip install -e ".[testing]"
          fetch-depth: "0"
      - name: Verify package entry point and imports
        env:
          PYTHONHASHSEED: "0"
        run: |
          python -c "import RosettaX; import RosettaX.application; import RosettaX.workflow"
          python -m RosettaX --help
          python - <<'PY'
          from RosettaX.application.main import RosettaXApplication

          application = RosettaXApplication(
              host="127.0.0.1", port=8050, open_browser=False, debug=False,
          )
          response = application.app.server.test_client().get("/")
          assert response.status_code == 200, response.status_code
          PY
