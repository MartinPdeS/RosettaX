# Device defaults, optical preset definitions, and figure paths relative to assets.
# Omit an unverified Rosetta channel. Each list contains exact FCS column names.
# Rosetta pairs below come from the bundled cross-device FCS samples.
# Instruments with channel recommendations alone have no optical presets here.

[instruments.agilent_novocyte]
manufacturer = "Agilent"
model = "NovoCyte"
instrument_aliases = ["agilent novocyte", "novocyte", "novocyte advanteon", "novocyte quattro"]

[instruments.agilent_novocyte.detector_channels]
default = ["SSC-A", "SSC-H", "SSC Area", "SSC"]
forward = ["FSC-A", "FSC-H", "FSC Area", "FSC"]

[instruments.agilent_novocyte.detectors.fsc]
preset_name = "Agilent NovoCyte FSC"
detector_figure = "detector_figures/agilent_novocyte_fsc.png"
detector_figure_label = "NovoCyte FSC"
channel = "FSC"
description = "Forward scatter detector preset for Agilent NovoCyte style modeling. The numerical aperture values here are effective modeling assumptions intended to give RosettaX a documented starting point rather than an instrument-certified optical reconstruction."
detector_type = "photodiode"
wavelength_nm = 488.0
detector_numerical_aperture = 0.2
detector_cache_numerical_aperture = 0.08
detector_sampling = 700
blocker_bar_numerical_aperture = 0.0
detector_phi_angle_degree = 0.0
detector_gamma_angle_degree = 0.0

[instruments.agilent_novocyte.detectors.ssc]
preset_name = "Agilent NovoCyte SSC"
detector_figure = "detector_figures/agilent_novocyte_ssc.png"
detector_figure_label = "NovoCyte SSC"
channel = "SSC"
description = "Side scatter detector preset for Agilent NovoCyte style modeling. The numerical aperture values here are effective modeling assumptions intended to support RosettaX detector selection and geometric calibration workflows."
detector_type = "PMT"
wavelength_nm = 405.0
detector_numerical_aperture = 1.0
detector_cache_numerical_aperture = 0.0
detector_sampling = 900
blocker_bar_numerical_aperture = 0.0
detector_phi_angle_degree = 90.0
detector_gamma_angle_degree = 0.0

