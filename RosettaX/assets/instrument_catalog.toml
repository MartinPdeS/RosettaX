preset_name = "Stratedigm S1313EX FSC"
channel = "FSC"
fcs_channels = ["FSC LinH", "FSC LogH"]
description = "488 nm forward-scatter model based on the reported S1000 collection angles."
wavelength_nm = 488.0
detector_type = "photodiode"
detector_numerical_aperture = 0.185518
detector_cache_numerical_aperture = 0.023264
detector_sampling = 800
