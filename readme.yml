         :target: https://doi.org/10.5281/zenodo.19846629

      If you use RosettaX in scientific work, please cite its Zenodo concept DOI:
      ``10.5281/zenodo.19846629``. It always resolves to the latest published Zenodo
      release.

      .. code-block:: bibtex

